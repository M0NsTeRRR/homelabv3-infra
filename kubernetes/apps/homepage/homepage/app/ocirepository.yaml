metadata:
  name: homepage
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 5.3.0
    digest: sha256:7ba2f83292d1d66a8eb45ea127aaaae157dda5b7680d74b3f96d14ba5547d560
  url: oci://ghcr.io/m0nsterrr/helm-charts/homepage
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/M0NsTeRRR/helm-charts.*$"
