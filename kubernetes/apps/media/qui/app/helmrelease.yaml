---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 1h
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    extraEnvFrom:
      - configMapRef:
          name: qui
      - secretRef:
          name: qui-openbao
    volumes:
      - name: &volume-ca ca-certs
        configMap:
          name: homelab-ca
      - name: &volume-postgres postgres-certs
        secret:
          secretName: postgres-cert-${APP}
          defaultMode: 0400
      - name: &volume-data data
        persistentVolumeClaim:
          claimName: media-storage
    volumeMounts:
      - name: *volume-ca
        mountPath: /var/run/secrets/root-ca/ca.crt
        subPath: ca.crt
        readOnly: true
      - name: *volume-postgres
        mountPath: /var/run/secrets/postgresql
        readOnly: true
      - name: *volume-data
        mountPath: /tv
        subPath: tv
      - name: *volume-data
        mountPath: /movies
        subPath: movies
      - name: *volume-data
        mountPath: /downloads
        subPath: downloads

    route:
      main:
        enabled: true
        kind: HTTPRoute
        apiVersion: gateway.networking.k8s.io/v1
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: qui
          gethomepage.dev/description: Media System
          gethomepage.dev/icon: qui.png
        parentRefs:
          - name: internal
            namespace: gateway
        hostnames:
          - qui.unicornafk.fr

    serviceMonitor:
      enabled: true
