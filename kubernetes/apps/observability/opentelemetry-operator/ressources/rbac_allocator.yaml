---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: targetallocator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-targetallocator
  annotations:
    ignore-check.kube-linter.io/wildcard-in-rules: "otel /metrics endpoints"
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - scrapeconfigs
      - servicemonitors
      - podmonitors
      - probes
    verbs:
      - "*"
  - apiGroups: [""]
    resources:
      - namespaces
    verbs: ["get", "list", "watch"]
---
# The allocator watches the secrets of its own namespace (ServiceMonitor auth), so it needs list/watch there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-targetallocator-secrets
  annotations:
    ignore-check.kube-linter.io/access-to-secrets: "target allocator watches secrets referenced by ServiceMonitors, namespace scoped"
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-targetallocator-secrets
subjects:
  - kind: ServiceAccount
    name: targetallocator
    namespace: observability
roleRef:
  kind: Role
  name: otel-targetallocator-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-targetallocator
subjects:
  - kind: ServiceAccount
    name: targetallocator
    namespace: observability
roleRef:
  kind: ClusterRole
  name: otel-targetallocator
  apiGroup: rbac.authorization.k8s.io
