---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-openbao
spec:
  refreshInterval: "1m"
  target:
    creationPolicy: "Owner"
    deletionPolicy: "Retain"
  secretStoreRef:
    kind: SecretStore
    name: kanidm-openbao
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: "secret/data/homelab/prod/kanidm"
        property: BACKUP_S3_ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: "secret/data/homelab/prod/kanidm"
        property: BACKUP_S3_SECRET_KEY
    - secretKey: encryption-key
      remoteRef:
        key: "secret/data/homelab/prod/kanidm"
        property: BACKUP_S3_ENCRYPTION_KEY
