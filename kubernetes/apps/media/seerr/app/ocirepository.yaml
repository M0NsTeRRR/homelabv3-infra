apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: seerr
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.10.1
    digest: sha256:5bda959777d3f1cddc747fe0c344c7ecd3b7340a8f2db4978781cbe2f3405108
  url: oci://ghcr.io/seerr-team/seerr/seerr-chart
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/seerr-team/seerr.*$"
