---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  valuesFrom:
    - kind: Secret
      name: flux-kanidm-oauth2-credentials
      valuesKey: CLIENT_SECRET
      targetPath: web.config.authentication.oauth2.clientSecret
      optional: true
  values:
    serviceMonitor:
      create: true
    web:
      config:
        baseURL: https://flux.unicornafk.fr
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            clientID: ${APP}
            issuerURL: https://sso.unicornafk.fr/oauth2/openid/${APP}
            autoLogin: true
      httpRoute:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Other
          gethomepage.dev/name: Flux
          gethomepage.dev/description: Open and extensible continuous delivery solution for Kubernetes. Powered by GitOps Toolkit.
        parentRefs:
          - name: internal
            namespace: gateway
        hostnames:
          - flux.unicornafk.fr
      networkPolicy:
        create: false
    extraVolumes:
      - name: homelab-ca
        configMap:
          name: homelab-ca
    extraVolumeMounts:
      - name: homelab-ca
        mountPath: /etc/ssl/certs/homelab-ca.crt
        subPath: ca.crt
        readOnly: true
