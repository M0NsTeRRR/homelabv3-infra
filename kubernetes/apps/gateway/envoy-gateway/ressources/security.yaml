---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security
spec:
  parentRefs:
    - name: external
      namespace: gateway
  hostnames: ["adminafk.fr", "unicornafk.fr"]
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/security.txt
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cache-Control
                value: public, max-age=600
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: security-filter
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: security-filter
spec:
  directResponse:
    contentType: text/plain
    statusCode: 200
    body:
      type: Inline
      inline: |
        -----BEGIN PGP SIGNED MESSAGE-----
        Hash: SHA512

        Canonical: https://adminafk.fr/.well-known/security.txt
        Canonical: https://unicornafk.fr/.well-known/security.txt
        Contact: mailto:security@adminafk.fr
        Preferred-Languages: en, fr
        Encryption: https://keys.openpgp.org/vks/v1/by-fingerprint/81E390A404C7D583A6D6958E22F86C9B1BEC401D

        -----BEGIN PGP SIGNATURE-----

        iHUEARYKAB0WIQShnweyxLU8erC55aGHRxRm6xhqTAUCapS0ywAKCRCHRxRm6xhq
        TJm1APsF6uPHIQ2aYPFnFnrm3VJboVxd5W2UjW6pA2f/f5ygugD/WakJ480pkL+h
        zn9wdkI6r3JSaTRtbUFMJMxwMKt0SAw=
        =cK8t
        -----END PGP SIGNATURE-----
