---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
spec:
  components:
    - ../../../../components/kanidm-oidc
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/app
  postBuild:
    substitute:
      APP: flux
      OIDC_ORIGIN: https://flux.unicornafk.fr
      OIDC_REDIRECT_URL: https://flux.unicornafk.fr/oauth2/callback
    substituteFrom:
      - kind: Secret
        name: flux-kanidm-oauth2-credentials
        optional: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
