---
openbao_ca_path: "{{ ca_certificates_local_path_ca_certificate }}"
openbao_secrets_engine:
  - name: kv-v2
    path: secret
  - name: pki
    path: pki
    tunes:
      max-lease-ttl: 8760h
      passthrough-request-headers:
        - If-Modified-Since
        - Last-Modified
        - Location
        - Replay-Nonce
        - Link
      allowed_response_headers:
        - Location
        - Link
        - Replay-Nonce
openbao_auth_methods:
  - name: oidc
    path: oidc
  - name: kubernetes
    path: kubernetes
openbao_policies:
  - name: viewer
    rules:
      - path: /secret/*
        capabilities:
          - read
          - list
      - path: pki*
        capabilities:
          - read
          - list
  - name: pki
    rules:
      - path: pki*
        capabilities:
          - read
          - list
      - path: pki/sign/*
        capabilities:
          - create
          - update
      - path: pki/issue/*
        capabilities:
          - create
  - name: actualbudget
    rules:
      - path: secret/data/homelab/prod/actualbudget
        capabilities:
          - read
  - name: as212510-net
    rules:
      - path: secret/data/homelab/prod/as212510-net
        capabilities:
          - read
  - name: bazarr
    rules:
      - path: secret/data/homelab/prod/bazarr
        capabilities:
          - read
  - name: cert-manager-webhook-infomaniak
    rules:
      - path: secret/data/homelab/prod/cert_manager_webhook_infomaniak
        capabilities:
          - read
  - name: cnpg
    rules:
      - path: secret/data/homelab/prod/cnpg
        capabilities:
          - read
  - name: csi-driver-smb
    rules:
      - path: secret/data/homelab/prod/csi-driver-smb
        capabilities:
          - read
  - name: external-dns-external
    rules:
      - path: secret/data/homelab/prod/external_dns/external
        capabilities:
          - read
  - name: external-dns-internal
    rules:
      - path: secret/data/homelab/prod/external_dns/internal
        capabilities:
          - read
  - name: flux
    rules:
      - path: secret/data/homelab/prod/flux
        capabilities:
          - read
  - name: grafana
    rules:
      - path: secret/data/homelab/prod/grafana
        capabilities:
          - read
  - name: jellyfin
    rules:
      - path: secret/data/homelab/prod/jellyfin
        capabilities:
          - read
  - name: kanidm
    rules:
      - path: secret/data/homelab/prod/kanidm
        capabilities:
          - read
  - name: looking-glass
    rules:
      - path: secret/data/homelab/prod/looking-glass
        capabilities:
          - read
  - name: prometheus-snmp-exporter
    rules:
      - path: secret/data/homelab/prod/prometheus-snmp-exporter
        capabilities:
          - read
  - name: prowlarr
    rules:
      - path: secret/data/homelab/prod/prowlarr
        capabilities:
          - read
  - name: qbittorrent
    rules:
      - path: secret/data/homelab/prod/qbittorrent
        capabilities:
          - read
      - path: secret/data/homelab/prod/gluetun
        capabilities:
          - read
  - name: qui
    rules:
      - path: secret/data/homelab/prod/qui
        capabilities:
          - read
  - name: radarr
    rules:
      - path: secret/data/homelab/prod/radarr
        capabilities:
          - read
  - name: recyclarr
    rules:
      - path: secret/data/homelab/prod/sonarr
        capabilities:
          - read
      - path: secret/data/homelab/prod/radarr
        capabilities:
          - read
  - name: rook-ceph-cluster
    rules:
      - path: secret/data/homelab/prod/rook-ceph-cluster
        capabilities:
          - read
  - name: seerr
    rules:
      - path: secret/data/homelab/prod/seerr
        capabilities:
          - read
  - name: sonarr
    rules:
      - path: secret/data/homelab/prod/sonarr
        capabilities:
          - read
public_openbao_datas:
  - path: auth/kubernetes/config
    data:
      kubernetes_host: "https://10.43.0.1:443"
  - path: auth/kubernetes/role/actualbudget
    data:
      bound_service_account_names: actualbudget-openbao
      bound_service_account_namespaces: actualbudget
      policies: actualbudget
      ttl: 1h
  - path: auth/kubernetes/role/as212510-net
    data:
      bound_service_account_names: as212510-net-openbao
      bound_service_account_namespaces: as212510-net
      policies: as212510-net
      ttl: 1h
  - path: auth/kubernetes/role/bazarr
    data:
      bound_service_account_names: bazarr-openbao
      bound_service_account_namespaces: media
      policies: bazarr
      ttl: 1h
  - path: auth/kubernetes/role/cert-manager-openbao
    data:
      bound_service_account_names: cert-manager-openbao
      bound_service_account_namespaces: cert-manager
      audience: "vault://openbao"
      policies: pki
      ttl: 1m
  - path: auth/kubernetes/role/cert-manager-webhook-infomaniak
    data:
      bound_service_account_names: cert-manager-webhook-infomaniak-openbao
      bound_service_account_namespaces: cert-manager-webhook-infomaniak
      policies: cert-manager-webhook-infomaniak
      ttl: 1h
  - path: auth/kubernetes/role/cnpg
    data:
      bound_service_account_names: cnpg-openbao
      bound_service_account_namespaces: postgres
      policies: cnpg
      ttl: 1h
  - path: auth/kubernetes/role/csi-driver-smb
    data:
      bound_service_account_names: csi-driver-smb-openbao
      bound_service_account_namespaces: csi-driver-smb
      policies: csi-driver-smb
      ttl: 1m
  - path: auth/kubernetes/role/external-dns-external
    data:
      bound_service_account_names: external-dns-openbao
      bound_service_account_namespaces: external-dns-external
      policies: external-dns-external
      ttl: 1h
  - path: auth/kubernetes/role/external-dns-internal
    data:
      bound_service_account_names: external-dns-openbao
      bound_service_account_namespaces: external-dns-internal
      policies: external-dns-internal
      ttl: 1h
  - path: auth/kubernetes/role/flux
    data:
      bound_service_account_names: flux-openbao
      bound_service_account_namespaces: flux-system
      policies: flux
      ttl: 1h
  - path: auth/kubernetes/role/grafana
    data:
      bound_service_account_names: grafana-openbao
      bound_service_account_namespaces: observability
      policies: grafana
      ttl: 1h
  - path: auth/kubernetes/role/jellyfin
    data:
      bound_service_account_names: jellyfin-openbao
      bound_service_account_namespaces: media
      policies: jellyfin
      ttl: 1h
  - path: auth/kubernetes/role/kanidm
    data:
      bound_service_account_names: kanidm-openbao
      bound_service_account_namespaces: kaniop
      policies: kanidm
      ttl: 1h
  - path: auth/kubernetes/role/looking-glass
    data:
      bound_service_account_names: looking-glass-openbao
      bound_service_account_namespaces: looking-glass
      policies: looking-glass
      ttl: 1h
  - path: auth/kubernetes/role/prometheus-snmp-exporter
    data:
      bound_service_account_names: prometheus-snmp-exporter-openbao
      bound_service_account_namespaces: observability
      policies: prometheus-snmp-exporter
      ttl: 1h
  - path: auth/kubernetes/role/prowlarr
    data:
      bound_service_account_names: prowlarr-openbao
      bound_service_account_namespaces: media
      policies: prowlarr
      ttl: 1h
  - path: auth/kubernetes/role/qbittorrent
    data:
      bound_service_account_names: qbittorrent-openbao
      bound_service_account_namespaces: media
      policies: qbittorrent
      ttl: 1h
  - path: auth/kubernetes/role/qui
    data:
      bound_service_account_names: qui-openbao
      bound_service_account_namespaces: media
      policies: qui
      ttl: 1h
  - path: auth/kubernetes/role/radarr
    data:
      bound_service_account_names: radarr-openbao
      bound_service_account_namespaces: media
      policies: radarr
      ttl: 1h
  - path: auth/kubernetes/role/recyclarr
    data:
      bound_service_account_names: recyclarr-openbao
      bound_service_account_namespaces: media
      policies: recyclarr
      ttl: 1h
  - path: auth/kubernetes/role/rook-ceph-cluster
    data:
      bound_service_account_names: rook-ceph-cluster-openbao
      bound_service_account_namespaces: rook-ceph
      policies: rook-ceph-cluster
      ttl: 1h
  - path: auth/kubernetes/role/seerr
    data:
      bound_service_account_names: seerr-openbao
      bound_service_account_namespaces: media
      policies: seerr
      ttl: 1h
  - path: auth/kubernetes/role/sonarr
    data:
      bound_service_account_names: sonarr-openbao
      bound_service_account_namespaces: media
      policies: sonarr
      ttl: 1h
  - path: pki/config/acme
    data:
      enabled: true
  - path: pki/config/ca
    data:
      pem_bundle: |
        {{ lookup('ansible.builtin.file', ca_certificates_local_path_ca_certificate) }}
        {{ lookup('ansible.builtin.file', certs_dir_role_path ~ 'intermediate/openbao/openbao.crt') }}
        {{ lookup('pipe', 'openssl rsa -in ' ~ certs_dir_role_path ~ 'intermediate/openbao/openbao.key -passin pass:"' ~ ca_private_passphrase ~ '"') }}
  - path: pki/config/cluster
    data:
      path: https://openbao.unicornafk.fr:8200/v1/pki
      aia_path: https://openbao.unicornafk.fr:8200/v1/pki
  - path: pki/config/urls
    data:
      issuing_certificates: "{{ '{{' }}cluster_aia_path{{ '}}' }}/issuer/{{ '{{' }}issuer_id{{ '}}' }}/der"
      crl_distribution_points: "{{ '{{' }}cluster_aia_path{{ '}}' }}/issuer/{{ '{{' }}issuer_id{{ '}}' }}/crl/der"
      ocsp_servers: "{{ '{{' }}cluster_aia_path{{ '}}' }}/ocsp"
      enable_templating: true
  - path: pki/roles/cert-manager-openbao
    data:
      allow_any_name: true
      ttl: 7d
      max_ttl: 14d
      key_type: ec
      key_bits: 521
      signature_bits: 512
      organization: "{{ organization }}"
      country: "{{ country }}"
      require_cn: false # must be disabled for cert-manager
openbao_datas: "{{ public_openbao_datas + secret_openbao_datas }}"
