---
name: Kubernetes Lint
on:
  push:
    paths:
      - kubernetes/**
      - .github/workflows/kubernetes-lint.yml
  pull_request:
permissions: {}
jobs:
  kubernetes-lint:
    name: Lint
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pull-requests: read
    steps:
      - parallel:
          - name: Checkout code
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false
          - name: Install flate
            uses: home-operations/flate/action@v0.6.5
            with:
              cache: true

      - name: Test Flux resources
        run: flate test all --path ./kubernetes --no-progress
