---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kanidm-smtp
spec:
  refreshInterval: "1m"
  target:
    creationPolicy: "Owner"
    deletionPolicy: "Retain"
  secretStoreRef:
    kind: SecretStore
    name: kanidm-openbao
  data:
    - secretKey: username
      remoteRef:
        key: "secret/data/homelab/prod/kanidm"
        property: SMTP_USERNAME
    - secretKey: password
      remoteRef:
        key: "secret/data/homelab/prod/kanidm"
        property: SMTP_PASSWORD
