---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr
data:
  TZ: "Europe/Paris"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-files
data:
  recyclarr.yml: |-
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

    sonarr:
      series:
        base_url: http://sonarr
        api_key: !env_var SONARR_API_KEY

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: b34c968f58433a38e0e690d42a1dc37e  # [French VOSTFR] HD Bluray + WEB (1080p)
            reset_unmatched_scores:
              enabled: true
          - trash_id: d6252dce6af535107ed4b03e68052ae8  # [French VOSTFR] UHD Bluray + WEB (2160p)
            reset_unmatched_scores:
              enabled: true
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
            - trash_id: a23c8675c79118544fd74153394fa589  # [Unwanted] Unwanted Formats French
            - trash_id: 848fd356c200568fc5a6248150e7e7ea  # [Streaming Services] French

    radarr:
      movies:
        base_url: http://radarr
        api_key: !env_var RADARR_API_KEY

        quality_definition:
          type: movie

        quality_profiles:
          - trash_id: 1addc08c4232bc2617684d517df15f75  # [French VOSTFR] HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
          - trash_id: 525bf0513e2ac22fe116e8d7bec0a6b5  # [French VOSTFR] UHD Bluray + WEB
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
            - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
            - trash_id: 59f7ab9ff64d0026b011b985b1cc8670  # [Unwanted] Unwanted Formats French
            - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
              select:
                - eca37840c13c6ef2dd0262b141a5482f  # 4K Remaster
                - e0c07d59beb37348e975a930d5e50319  # Criterion Collection
                - 0f12c086e289cf966fa5948eac571f44  # Hybrid
                - eecf3a857724171f968a66cb5719e152  # IMAX
                - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced
                - 9d27d9d2181838f76dee150882bdc58c  # Masters of Cinema
                - 570bc9ebecd92723d2d21500f4be314c  # Remaster
                - 957d0f44b592285f26449575e8b1167e  # Special Edition
                - db9b4c4b53d312a3ca5f1378f6440fc9  # Vinegar Syndrome
