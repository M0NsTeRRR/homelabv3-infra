---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actualbudget
spec:
  chartRef:
    kind: OCIRepository
    name: actualbudget
  interval: 1h
  values:
    annotations:
      reloader.stakater.com/auto: "true"

    data:
      persistence:
        enabled: false

    extraEnv:
      - name: NODE_EXTRA_CA_CERTS
        value: /etc/ssl/certs/homelab.crt
      - name: ACTUAL_OPENID_DISCOVERY_URL
        value: https://sso.unicornafk.fr/oauth2/openid/${APP}/.well-known/openid-configuration
      - name: ACTUAL_OPENID_SERVER_HOSTNAME
        value: https://actualbudget.unicornafk.fr
      - name: ACTUAL_OPENID_PROVIDER_NAME
        value: Kanidm
      - name: ACTUAL_OPENID_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: ${APP}-kanidm-oauth2-credentials
            key: CLIENT_ID
      - name: ACTUAL_OPENID_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: ${APP}-kanidm-oauth2-credentials
            key: CLIENT_SECRET

    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ${APP}
      - name: ca-certs
        configMap:
          name: homelab-ca

    volumeMounts:
      - name: data
        mountPath: /data
      - name: ca-certs
        mountPath: /etc/ssl/certs/homelab.crt
        subPath: ca.crt
        readOnly: true

    route:
      main:
        enabled: true
        kind: HTTPRoute
        apiVersion: gateway.networking.k8s.io/v1
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Other
          gethomepage.dev/name: Actualbudget
          gethomepage.dev/description: Finance manager
        parentRefs:
          - name: internal
            namespace: gateway
        hostnames:
          - actualbudget.unicornafk.fr
