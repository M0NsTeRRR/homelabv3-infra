---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  chartRef:
    kind: OCIRepository
    name: external-dns
  interval: 1h
  values:
    nameOverride: "external-dns-external"
    logFormat: json
    podAnnotations:
      reloader.stakater.com/auto: "true"
    registry: txt
    txtOwnerId: "homelab.k8s"
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - crd
      - gateway-httproute
      - gateway-tlsroute
      - service
    domainFilters:
      - adminafk.fr
      - as212510.net
    extraArgs:
      - --min-ttl=60s
      - --gateway-name=external
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --default-targets=82.65.135.80
      - --default-targets=2a0c:b641:2c0:110::100
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/m0nsterrr/external-dns-webhook-infomaniak
          tag: v0.1.5@sha256:313e126d1bd0226f59c9ba947dea873e3c34e9dc85a2cb05b7f63340058cf7ee
        env:
          - name: INFOMANIAK_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: external-dns-openbao
                key: api-token
    service:
      ipFamilyPolicy: "PreferDualStack"
    serviceMonitor:
      enabled: true
