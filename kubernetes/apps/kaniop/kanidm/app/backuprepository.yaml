---
apiVersion: kaniop.rs/v1alpha1
kind: KanidmBackupRepository
metadata:
  name: kanidm
spec:
  s3:
    bucket: kanidm
    prefix: kanidm
    region: us-west-1
    endpoint: https://nas.unicornafk.fr:30292
    forcePathStyle: true
    caBundleRef: homelab-ca
  authentication:
    writer:
      secretRef:
        name: kanidm-openbao
    reader:
      secretRef:
        name: kanidm-openbao
    deleter:
      secretRef:
        name: kanidm-openbao
  encryption:
    mode: clientSide
    keyRef:
      name: encryption-key
