---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: jellyfin-admin
spec:
  kanidmRef:
    name: kanidm
    namespace: kaniop
  members:
    - ludovic.ortega
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: jellyfin-user
spec:
  kanidmRef:
    name: kanidm
    namespace: kaniop
  members: []
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: jellyfin
spec:
  kanidmRef:
    name: kanidm
    namespace: kaniop
  displayname: Jellyfin
  origin: https://jellyfin.unicornafk.fr
  redirectUrl:
    # SSO plugin (9p4/jellyfin-plugin-sso): provider name configured in the plugin must be "kanidm"
    - https://jellyfin.unicornafk.fr/sso/OID/redirect/kanidm
    - https://jellyfin.unicornafk.fr/sso/OID/r/kanidm
  preferShortUsername: true
  scopeMap:
    - group: jellyfin-admin
      scopes: &scopes
        - openid
        - profile
        - groups_name
    - group: jellyfin-user
      scopes: *scopes
  disableConsentPrompt: true
