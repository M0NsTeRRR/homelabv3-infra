---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app qui
spec:
  components:
    - ../../../../components/external-secrets
    - ../../../../components/database/certificate
    - ../../../../components/kanidm-oidc
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/media/qui/app
  postBuild:
    substitute:
      APP: *app
      OIDC_ORIGIN: https://qui.unicornafk.fr
      OIDC_REDIRECT_URL: https://qui.unicornafk.fr/api/auth/oidc/callback
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qui-database
spec:
  interval: 1h
  path: ./kubernetes/components/database/base
  postBuild:
    substitute:
      APP: qui
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: postgres
