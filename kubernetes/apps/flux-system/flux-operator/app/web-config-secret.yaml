---
apiVersion: v1
kind: Secret
metadata:
  name: flux-web-config
stringData:
  config.yaml: |
    apiVersion: web.fluxcd.controlplane.io/v1
    kind: Config
    spec:
      baseURL: https://flux.unicornafk.fr
      authentication:
        type: OAuth2
        oauth2:
          provider: OIDC
          clientID: flux
          clientSecret: ${CLIENT_SECRET}
          issuerURL: https://sso.unicornafk.fr/oauth2/openid/flux
          scopes:
            - openid
            - offline_access
            - profile
            - email
            - groups_name
          autoLogin: true
          impersonation:
            username: "claims.preferred_username"
            groups: "claims.groups"
