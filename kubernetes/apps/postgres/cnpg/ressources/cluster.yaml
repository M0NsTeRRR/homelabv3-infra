---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:40168f065c5814acb464f38c9e43beb971f496ff03a27419f205a905043c578e

  certificates:
    serverCASecret: postgres-server-cert
    serverTLSSecret: postgres-server-cert
    clientCASecret: postgres-client-cert
    replicationTLSSecret: postgres-client-cert

  storage:
    storageClass: ceph-block
    size: 40Gi

  # bootstrap:
  #   recovery:
  #     source: &source source

  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &store rustfs-store

  # externalClusters:
  #   - name: *source
  #     plugin:
  #       name: *plugin
  #       parameters:
  #         barmanObjectName: *store
  #         serverName: postgres

  postgresql:
    pg_hba:
      - hostssl all all all cert clientcert=verify-full map=pooler-map

    pg_ident:
      - pooler-map pooler-rw all
