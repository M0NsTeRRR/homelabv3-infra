---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app actualbudget
spec:
  components:
    - ../../../../components/external-secrets
    - ../../../../components/volsync
    - ../../../../components/kanidm-oidc
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/actualbudget/actualbudget/app
  postBuild:
    substitute:
      APP: *app
      OIDC_ORIGIN: https://actualbudget.unicornafk.fr
      OIDC_REDIRECT_URL: https://actualbudget.unicornafk.fr/openid/callback
      VOLSYNC_CAPACITY: 1Gi
      VOLSYNC_PUID: "65534"
      VOLSYNC_PGID: "65534"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: actualbudget
