---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:cc582fd9966af873ae325cb26aaf8503483755f9c40b61935e328ea87b0fd8d8

  certificates:
    serverCASecret: postgres-server-cert
    serverTLSSecret: postgres-server-cert
    clientCASecret: postgres-client-cert
    replicationTLSSecret: postgres-client-cert

  storage:
    storageClass: ceph-block
    size: 40Gi

  # Only used when the Cluster is created: restores the latest backup + WAL from the object store.
  bootstrap:
    recovery:
      source: &source source

  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &store rustfs-store
        # Archive folder of THIS cluster. Must differ from the externalClusters serverName
        # below, otherwise barman refuses to archive into a non-empty folder.
        # Bump (v3, v4...) on every new recovery.
        serverName: postgres-v2

  externalClusters:
    - name: *source
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: *store
          serverName: postgres # archive folder of the previous cluster to restore from

  postgresql:
    pg_hba:
      - hostssl all all all cert clientcert=verify-full map=pooler-map

    pg_ident:
      - pooler-map pooler-rw all
