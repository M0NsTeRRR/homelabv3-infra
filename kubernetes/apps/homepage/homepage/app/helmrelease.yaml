---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  chartRef:
    kind: OCIRepository
    name: homepage
  interval: 1h
  values:
    config:
      allowedHosts:
        - &hostname homepage.unicornafk.fr

    annotations:
      reloader.stakater.com/auto: "true"

    extraEnv:
      - name: HOMEPAGE_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: ${APP}-kanidm-oauth2-credentials
            key: CLIENT_ID
      - name: HOMEPAGE_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: ${APP}-kanidm-oauth2-credentials
            key: CLIENT_SECRET
    extraEnvFrom:
      - configMapRef:
          name: homepage
      - secretRef:
          name: homepage-openbao

    volumes:
      - name: &volume-config homepage-configs
        configMap:
          name: homepage-configs
      - name: &volume-images images
        configMap:
          name: homepage-images
      - name: &volume-ca ca-certs
        configMap:
          name: homelab-ca
    volumeMounts:
      - name: *volume-ca
        mountPath: /etc/ssl/certs/homelab.crt
        subPath: ca.crt
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/settings.yaml
        subPath: settings.yaml
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/services.yaml
        subPath: services.yaml
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/widgets.yaml
        subPath: widgets.yaml
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/kubernetes.yaml
        subPath: kubernetes.yaml
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/docker.yaml
        subPath: docker.yaml
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/custom.css
        subPath: custom.css
        readOnly: true
      - name: *volume-config
        mountPath: /app/config/custom.js
        subPath: custom.js
        readOnly: true
      - name: *volume-images
        mountPath: /app/public/images/unicornafk.svg
        subPath: unicornafk.svg
        readOnly: true
      - name: *volume-images
        mountPath: /app/public/images/background.svg
        subPath: background.svg
        readOnly: true

    route:
      main:
        enabled: true
        kind: HTTPRoute
        apiVersion: gateway.networking.k8s.io/v1
        parentRefs:
          - name: internal
            namespace: gateway
        hostnames:
          - *hostname
