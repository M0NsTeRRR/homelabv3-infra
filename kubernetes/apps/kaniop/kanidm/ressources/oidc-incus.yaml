---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmgroup_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmGroup
metadata:
  name: incus-admin
spec:
  kanidmRef:
    name: kanidm
    namespace: kaniop
  members:
    - ludovic.ortega
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kaniop.rs/kanidmoauth2client_v1beta1.json
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: incus
spec:
  kanidmRef:
    name: kanidm
    namespace: kaniop
  displayname: incus
  origin: https://server1.unicornafk.fr:8443
  redirectUrl:
    - https://server1.unicornafk.fr:8443/oidc/callback
    - https://server2.unicornafk.fr:8443/oidc/callback
    - https://server3.unicornafk.fr:8443/oidc/callback
  public: true
  preferShortUsername: true
  scopeMap:
    - group: incus-admin
      scopes:
        - openid
        - profile
        - email
