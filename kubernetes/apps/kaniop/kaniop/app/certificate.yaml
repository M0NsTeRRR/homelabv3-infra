---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kanidm-tls
spec:
  secretName: kanidm-tls
  issuerRef:
    name: openbao
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  duration: 168h
  usages:
    - digital signature
    - server auth
  dnsNames:
    - sso.unicornafk.fr
    - kanidm.kaniop.svc
    - kanidm.kaniop.svc.cluster.local
