---
name: Kubernetes Lint
on:
  push:
    paths:
      - kubernetes/**
      - .github/workflows/kube-lint.yml
  pull_request:
permissions: {}
jobs:
  kubernetes-lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Scan repo with kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          directory: kubernetes
